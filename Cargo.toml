[package]
name = "opentelemetry-demo-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
# bb8-redis 0.18 exposes no feature flags, so TLS is enabled by feature
# unification: this direct dep resolves to the SAME redis 0.27.x that
# bb8-redis re-exports (the code imports via bb8_redis::redis) and turns on
# rustls, which rediss:// URLs (ElastiCache in-transit encryption) require.
redis = { version = "0.27.6", features = ["tokio-rustls-comp"] }
bb8-redis = "0.18"
tracing = "0.1.41"
tracing-opentelemetry = "0.31.0"
tracing-subscriber = {version = "0.3", features = ["env-filter"] }
opentelemetry = "0.30.0"
opentelemetry-otlp = { version = "0.30.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.30.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
http = "1.0"
hyper = "1.0"
