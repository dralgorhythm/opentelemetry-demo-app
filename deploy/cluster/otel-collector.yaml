# The ADOT collector: OTLP in (from every traced service), X-Ray out.
# Cluster infrastructure, not a product service — so it lives here as raw
# YAML, not a chart release; its IAM identity comes from
# terraform/modules/stack/otel.tf via Pod Identity on the SA below (which is
# why namespace + SA name here must match that association: default /
# otel-collector).
#
# Two replicas + PDB + spread: on a churning data plane (Auto Mode
# consolidation, node upgrades), a single collector drops spans at every
# reclaim of its node — and this demo's traces are its evidence. Same
# resilience floor as the roster; a daemonset or gateway tier is the
# at-scale answer.
# No NetworkPolicy on purpose: every namespace sends spans here.
#
# Trace IDs: the Rust OTel SDK generates W3C random trace IDs, and X-Ray
# accepts them natively (w3c-random-trace-id support, GA Oct 2023; ADOT
# collector >= v0.34 — this pin is v0.49.0), so no custom X-Ray ID generator
# is needed app-side. Fallback if that ever regresses: swap the awsxray
# exporter for otlphttp against the CloudWatch OTLP endpoint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector # Pod Identity association names this exact SA
  labels: { app: otel-collector }
---
# Config edits do NOT restart the Deployment (plain kubectl apply, no
# checksum annotation) — follow a config change with a rollout restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels: { app: otel-collector }
data:
  config.yaml: |
    extensions:
      # Serves GET / on :13133 — the Deployment's readiness/liveness probes
      # point here, so the Service only routes OTLP to a listening pod.
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          # Both wire protocols: the Rust app exports OTLP gRPC (4317);
          # http (4318) stays for anything speaking OTLP/HTTP.
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Backpressure before OOM: sized under the container's 128Mi limit so
      # a span burst refuses data (the SDK retries) instead of OOMKilling
      # the collector and dropping everything buffered. Must run FIRST in
      # the pipeline to protect the processors behind it.
      memory_limiter:
        check_interval: 1s
        limit_mib: 100
        spike_limit_mib: 25
      # X-Ray speaks the OLD OpenTelemetry HTTP conventions. The app emits the
      # CURRENT ones, correctly, so the translation belongs HERE — next to the
      # vendor exporter that needs it — rather than polluting the app with
      # deprecated attribute names. Nothing else in the pipeline is X-Ray
      # specific; this processor is, and it sits directly in front of it.
      #
      # Coverage is PARTIAL upstream, which is what made this hard to see:
      # http.request.method and user_agent.original already translate, and
      # url.scheme/url.path partly do (segments arrived as "http:///path" —
      # right path, missing host). Two things did not, and both matter:
      #
      #  http.status_code — WITHOUT IT EVERY SEGMENT ARRIVES AS status 0.
      #    X-Ray derives its error/fault/throttle classification from status,
      #    so the service map showed zero errors no matter what the app
      #    returned, and `http.status = 500` filters matched nothing. This is
      #    the single highest-impact line in this file.
      #
      #  http.url — the full URL, renamed from the app's `url.full`. Without
      #    it segments carried "http:///path": right path, no host, so X-Ray
      #    URL filters could never match a hostname or distinguish an
      #    environment.
      #
      # A span missing either source attribute simply passes through
      # untouched — `from_attribute` is a no-op when the source is absent, so
      # there is no shape of span this can drop.
      #
      # NOT the `transform` processor: ADOT does not bundle it. Verified by
      # running the real image — v0.49.0 AND :latest (which currently IS
      # v0.49.0) both reject it with `unknown type: "transform"`. This is a
      # curated component set, not a version lag, so upgrading does not help.
      # `attributes` is bundled and does everything needed here, because both
      # fixes are pure RENAMES — which is also why the app can keep emitting
      # only current semantic conventions.
      attributes/xray:
        actions:
          # insert, not upsert: if a future app or SDK already emits the old
          # key correctly, its value wins rather than being overwritten.
          - key: http.status_code
            from_attribute: http.response.status_code
            action: insert
          - key: http.url
            from_attribute: url.full
            action: insert
      batch: {}
    exporters:
      awsxray:
        # THE one region literal in the k8s layer — every other regional
        # wire derives from vars.AWS_REGION/the provider. Change this on a
        # region move (nothing gates it).
        region: us-east-1
        # X-Ray only INDEXES annotations. Everything else lands in metadata,
        # which is visible on a trace you already found but unusable as a
        # filter — which is why segments showed `annotations: None` and no
        # filter expression could select on anything the app knows.
        #
        # Deliberately short: annotations are a hard cap of 50 per trace and
        # every one is indexed storage. These three are the questions actually
        # asked in an incident — which build, which route, what status — and
        # all three are LOW CARDINALITY. url.path is the concrete path and is
        # NOT here on purpose: indexing an unbounded key is how you turn an
        # index into a bill.
        indexed_attributes:
          - service.version
          - http.status_code
          - http.route
    service:
      extensions: [health_check]
      pipelines:
        traces:
          # Order is deliberate: memory_limiter FIRST (backpressure before
          # anything else does work), attributes before batch so the rename
          # happens per-span rather than on assembled batches, awsxray last.
          receivers: [otlp]
          processors: [memory_limiter, attributes/xray, batch]
          exporters: [awsxray]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app: otel-collector }
spec:
  replicas: 2 # resilience floor — see header
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      serviceAccountName: otel-collector
      # Same placement diversity as the chart (deployment.yaml): two replicas
      # on one node would make the PDB below theater — one reclaim, no
      # collector. Node spread HARD, zone spread SOFT.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: otel-collector }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: otel-collector }
      securityContext:
        runAsNonRoot: true
        # The ADOT image declares USER by NAME (aoc); runAsNonRoot needs a
        # NUMERIC uid to verify, else CreateContainerConfigError.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          # Pinned: collector upgrades should be deliberate, not every deploy.
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.49.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          # Both probes hit the health_check extension (config above).
          # Readiness is the tight one — it only gates Service endpoints, so
          # a slow pod merely stops receiving; liveness restarts the
          # container, so it gets a longer leash.
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - { name: config, mountPath: /etc/otel, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: { app: otel-collector }
spec:
  type: ClusterIP
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# Caps VOLUNTARY disruption (drains, consolidation): evictions go one pod at
# a time, so a node roll always leaves one collector receiving spans. Raw
# YAML twin of the chart's pdb.yaml — the collector is cluster
# infrastructure, not a chart release.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
  labels: { app: otel-collector }
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: otel-collector }
