name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # least-privilege default; CD jobs (later PRs) add id-token per-job

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Before checkout on purpose: reads only event context, so the cheapest
      # gate fails in seconds. Feeds the release job's bump detection later.
      - name: Conventional Commits PR title
        if: github.event_name == 'pull_request'
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          echo "$TITLE" | grep -qE '^(feat|fix|perf|infra|docs|chore|refactor|test|build|ci)(\([^)]*\))?!?: .+' || {
            echo "::error::PR title must follow Conventional Commits (type[scope][!]: subject)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      # --locked everywhere doubles as the lockfile-drift gate (the
      # `go mod tidy` analog): a stale Cargo.lock fails instead of resolving.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Pinned like everything else here: an unpinned @latest scanner is the
      # same bug class the scanner exists to catch.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with: { tool: cargo-audit }
      - run: cargo audit
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with: { dockerfile: Dockerfile }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # Same class of drift as rustfmt, for this repo's other formatted language.
      - run: terraform fmt -check -recursive terraform/
      # Zero AWS inputs on purpose — the fork/fresh-clone gap: does the
      # chart even render before any cloud credentials exist.
      - run: helm lint charts/app
      # Every roster file rendered credential-free: a broken values file
      # fails here, not at deploy time.
      - run: |
          for f in deploy/services/*.yaml; do
            helm template "$(basename "$f" .yaml)" charts/app -f "$f" >/dev/null
          done
      # CONTENT asserts on the env-composed render, not just exit codes: the
      # CSI mount must name the env-qualified secret, the args must point at
      # the mounted config file, and the amd64 arch pin must survive the
      # merge (nodeSelector is a map — a well-meaning `{}` in a later -f
      # would deep-merge and silently keep or drop nothing a render-only
      # check would notice).
      #
      # EVERY environment, not just dev: promote.yml deploys a gated env from
      # these same files, and a values file that only gets rendered at
      # promote time is a values file that breaks during an approval window.
      # The secret-name assert is derived from the filename, so it doubles as
      # the naming-convention gate (deploy/envs/<env>.yaml must name
      # otel-demo-app-<env>/app/config, matching local.name in the stack
      # module) — that convention is what lets promote.yml take a bare env
      # string and need no per-env wiring.
      - run: |
          for envf in deploy/envs/*.yaml; do
            env=$(basename "$envf" .yaml)
            out=$(helm template smoke charts/app -f deploy/services/app.yaml -f "$envf")
            grep -q "objectName: \"otel-demo-app-${env}/app/config\"" <<<"$out" \
              || { echo "::error::$envf must name the otel-demo-app-${env}/app/config secret"; exit 1; }
            grep -q -- '/mnt/secrets-store/config.yml' <<<"$out"
            grep -q 'kubernetes.io/arch: amd64' <<<"$out"
            echo "rendered $env ✓"
          done
      # The only gate that ever looks at the scripts in this repo.
      - run: shellcheck scripts/*.sh
      # fs scan: catches secrets and known-CVE deps (Cargo.lock) before any
      # image exists. Overlaps cargo-audit on vulns — kept, both are cheap.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  # Read-only Terraform plan on PRs that touch terraform/ — the review
  # surface for infra changes. Runs as the -ci-plan role: broad sub trust so
  # PR tokens match, ReadOnlyAccess so a PR can render a plan but never
  # mutate. Applies happen only from main (infra job below).
  # `head.repo == github.repository` is the FORK GUARD: fork PRs are excluded
  # mechanically, not by policy.
  # Gated on vars.AWS_ACCOUNT_ID: skips cleanly until terraform/bootstrap has
  # been applied locally and the repo variables set (docs/bootstrap.md).
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_ACCOUNT_ID != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      # Mirror the infra job's TF_VARs or the PR plan diverges from the apply.
      TF_VAR_admin_principal_arn: "${{ vars.ADMIN_PRINCIPAL_ARN }}"
      TF_VAR_alert_email: "${{ vars.ALERT_EMAIL }}" # unset variable = empty = alerting stays unsubscribed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 } # PR checkout is the merge commit; HEAD^1 = base
      - id: touched
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^terraform/'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
            echo "terraform/ untouched — no plan to render"
          fi
      - if: steps.touched.outputs.tf == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with: { role-to-assume: "${{ vars.CI_PLAN_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION || 'us-east-1' }}" }
      - if: steps.touched.outputs.tf == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # -lock=false: a read-only role can't write the S3 lock object, and an
      # advisory plan doesn't need one.
      - if: steps.touched.outputs.tf == 'true'
        name: Plan shared stack
        working-directory: terraform/shared
        run: |
          terraform init
          terraform plan -lock=false -no-color -input=false | tee plan.txt
          { echo '### terraform/shared'; echo '```'; tail -c 20000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # PLAN-READING GOTCHA: the cluster's creator-admin access entry resolves
      # from the CALLER, so under the read-only -ci-plan role every PR plan
      # shows that entry + its policy association "must be replaced"
      # (principal_arn -ci -> -ci-plan) — a standing phantom diff that
      # vanishes at apply, where the -ci role matches state. See the comment
      # on enable_cluster_creator_admin_permissions in modules/stack/eks.tf.
      - if: steps.touched.outputs.tf == 'true'
        name: Plan env stack
        working-directory: terraform/envs/dev
        run: |
          terraform init
          terraform plan -lock=false -no-color -input=false | tee plan.txt
          { echo '### terraform/envs/dev'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ── CD: GitHub Actions owns every apply. The only local Terraform is the
  # one-time apply of terraform/bootstrap (the CI identity) — docs/bootstrap.md.
  # Auth is OIDC: short-lived STS creds per job, no keys. Gated on the
  # AWS_ACCOUNT_ID repo variable so these jobs skip cleanly until bootstrap
  # has run (set it and CD switches itself on).
  infra:
    if: github.event_name != 'pull_request' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    needs: gates
    permissions: { id-token: write, contents: read }
    # environment: swaps the OIDC sub to "…:environment:dev" — the dev role's
    # trust lists that sub. Dev has NO protection rules: continuous deploy
    # stays hands-free.
    environment: dev
    # One dev-mutating job at a time (group shared with future deploy/destroy).
    concurrency: { group: env-dev, cancel-in-progress: false }
    env:
      # Humans need their own access entry: the creator-admin entry goes to the
      # APPLIER of this Terraform, which is the CI role — not you. Set the
      # ADMIN_PRINCIPAL_ARN repo variable to your human principal's IAM ARN —
      # for Identity Center that's the underlying role WITH its path, e.g.
      # arn:aws:iam::<acct>:role/aws-reserved/sso.amazonaws.com/<region>/AWSReservedSSO_...
      # (NOT the sts assumed-role ARN). Empty = no human access entry.
      # Caveat: the suffix changes if the permission set is reprovisioned.
      TF_VAR_admin_principal_arn: "${{ vars.ADMIN_PRINCIPAL_ARN }}"
      # The ALB-alarm email (terraform/modules/stack/alerting.tf). CI is the
      # ONLY applier of this stack, so without this mapping the subscription
      # is unreachable: set it via `gh variable set ALERT_EMAIL`.
      TF_VAR_alert_email: "${{ vars.ALERT_EMAIL }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # full history: the diff below spans the whole pushed range
      # Docs/app-only merges skip the no-op terraform cycle. workflow_dispatch
      # always applies — on-demand reconciliation replaces every-merge drift
      # correction.
      - id: touched
        run: |
          # Diff the WHOLE pushed range (event.before..HEAD), not HEAD^..HEAD:
          # a rebase-merge lands every PR commit in one push, and tip-only
          # diffing silently skips the apply when an earlier commit touched
          # terraform/. Fall back to HEAD^ when before is unusable.
          before="${{ github.event.before }}"
          case "$before" in ""|0000000000000000000000000000000000000000) before="HEAD^";; esac
          git cat-file -e "$before" 2>/dev/null || before="HEAD^"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || git diff --name-only "$before" HEAD | grep -q '^terraform/'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
            echo "terraform/ untouched — skipping plan+apply"
          fi
      # Two credentials in one job: the SHARED stack applies as the scoped
      # ci-shared role (the env role's boundary denies shared state by
      # design), then the env stack re-configures to the env's own role.
      # CI_SHARED_ROLE_ARN falls back to CI_ROLE_ARN until the bootstrap
      # apply has set the variable.
      - if: steps.touched.outputs.tf == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with: { role-to-assume: "${{ vars.CI_SHARED_ROLE_ARN || vars.CI_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION || 'us-east-1' }}" }
      - if: steps.touched.outputs.tf == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # The account-shared stack (ECR) applies FIRST: repos must exist before
      # the (future) deploy job pushes images. Warm path is a ~10s no-op.
      - if: steps.touched.outputs.tf == 'true'
        name: Apply shared stack
        working-directory: terraform/shared
        run: |
          terraform init
          terraform plan -out=tfplan -no-color | tee plan.txt
          { echo '### terraform/shared (applied)'; echo '```'; tail -c 20000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -auto-approve tfplan
      - if: steps.touched.outputs.tf == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with: { role-to-assume: "${{ vars.CI_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION || 'us-east-1' }}" }
      - if: steps.touched.outputs.tf == 'true'
        working-directory: terraform/envs/dev
        run: terraform init
      - if: steps.touched.outputs.tf == 'true'
        working-directory: terraform/envs/dev
        run: terraform plan -out=tfplan -no-color | tee plan.txt
      # The PR plan is advisory — state can drift between review and merge.
      # THIS plan is the one auto-approved, so it goes in the run summary as
      # the audit record of what was actually applied. (The first from-zero
      # env apply is the long one: ~15-20 min for VPC + EKS.)
      - if: steps.touched.outputs.tf == 'true'
        name: Record the applied plan
        working-directory: terraform/envs/dev
        run: |
          { echo '### terraform/envs/dev (applied)'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.touched.outputs.tf == 'true'
        working-directory: terraform/envs/dev
        run: terraform apply -auto-approve tfplan

  # The roster is deploy/services/ — filenames become the build matrix and
  # the (future) deploy loops. Adding a service never edits this workflow.
  # PRs prove, main ships: the proof-build matrix runs on PRs only.
  roster:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          services=$(scripts/roster.sh | cut -f1 | jq -R . | jq -sc .)
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "roster: $services"

  # Prove every service image builds on PRs. Pushing needs ECR creds ->
  # arrives with CD.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [gates, roster]
    strategy:
      matrix:
        service: ${{ fromJson(needs.roster.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: "${{ matrix.service }}:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && vars.AWS_ACCOUNT_ID != ''
    # No docker-build dependency: the proof matrix is PR-only ("PRs prove,
    # main ships" — see the roster job); deploy builds its own images.
    needs: [gates, infra]
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    # Same environment + group as infra: one dev-mutating job at a time, so
    # merges can't race `helm upgrade` and a dispatched dev destroy can never
    # interleave with a live deploy.
    environment: dev
    concurrency: { group: env-dev, cancel-in-progress: false }
    # DEPLOY_ENV names the target environment; CLUSTER must stay
    # otel-demo-app-<DEPLOY_ENV> (GitHub env blocks can't self-reference —
    # keep the pair in sync).
    env: { AWS_REGION: "${{ vars.AWS_REGION || 'us-east-1' }}", ECR_REPO: otel-demo-app, DEPLOY_ENV: dev, CLUSTER: otel-demo-app-dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with: { role-to-assume: "${{ vars.CI_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION || 'us-east-1' }}" }
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: ecr
      # One loop, N images. ECR tags are IMMUTABLE: an already-pushed SHA is
      # skipped per-service, so re-runs stay idempotent.
      - name: Build and push service images
        run: |
          while IFS=$'\t' read -r svc _f _ns; do
            repo="${{ steps.ecr.outputs.registry }}/${ECR_REPO}/$svc"
            if aws ecr describe-images --repository-name "${ECR_REPO}/$svc" --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
              echo "$svc:${{ github.sha }} already in ECR — skipping (immutable)"
              continue
            fi
            docker build -t "$repo:${{ github.sha }}" .
            docker push "$repo:${{ github.sha }}"
          done < <(scripts/roster.sh)
      - name: Deploy the roster
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          # Cluster-scoped config first: the ADOT collector the app exports
          # traces to must exist before any release that points at it.
          kubectl apply -f deploy/cluster/
          # One release per service: deploy/services/ IS the roster. Service
          # #2 is one values file here, zero workflow edits.
          while IFS=$'\t' read -r svc f ns; do
            # deploy/envs/<env>.yaml is the LAST -f: environment-qualified
            # values (see its header) override the service file.
            helm upgrade --install "$svc" ./charts/app -f "$f" -f "deploy/envs/${DEPLOY_ENV}.yaml" \
              --set "image.repository=${{ steps.ecr.outputs.registry }}/${ECR_REPO}/$svc" \
              --set "image.tag=${{ github.sha }}" \
              -n "$ns" --create-namespace --wait --atomic --timeout 5m
          done < <(scripts/roster.sh)
          # --atomic: a failed rollout auto-rolls-back to the previous revision
      # The deploy gate is the SMOKE SUITE, not a liveness ping: healthz +
      # greeting through the ALB, and the visitor counter must INCREMENT
      # across two calls — the ElastiCache TLS+AUTH round trip, end to end.
      # (No EXPECT_SHA/version stamp: the app doesn't self-report a build yet
      # — deferred with service.version.) Same script a laptop runs.
      - name: Smoke the live stack (the deploy gate)
        run: |
          scripts/smoke.sh cloud
          HOST=$(kubectl -n otel-demo get ingress app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "### Serving at http://$HOST — smoked green at ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          # Rollback reference: revision history straight in the run summary —
          # `helm rollback <svc> <rev> -n <ns>` is a TEMPORARY stopgap (every
          # merge re-asserts main); the durable fix is always a revert PR.
          # Non-fatal on purpose: the smoke call above is the gate — a helm/API
          # hiccup HERE must not fail a step whose real gate already passed
          # (that would also block the release job for a verified deploy).
          { echo ""; echo "Release revisions (rollback ref):"; echo '```'; helm list -A || echo "(helm list failed — smoke gate above is authoritative)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ── Release: semver, cut automatically on merge to main ────────────────────
  # Bump is driven by PR TITLES — the exact strings the gates job lint-verifies
  # on every PR; the grep ladder below is the whole mapping. Hand-rolled on
  # purpose: ~30 auditable lines and zero third-party actions in a
  # token-bearing workflow (release-please / semantic-release are the at-scale
  # alternatives). needs:[deploy] makes a release mean "this version is live
  # and smoke-verified"; every roster service's image gets the semver as an
  # ECR tag alias next to its SHA (IMMUTABLE adds tags, never repoints).
  release:
    if: github.event_name != 'pull_request' && vars.AWS_ACCOUNT_ID != ''
    needs: [deploy]
    runs-on: ubuntu-latest
    # pull-requests:read backs the gh pr view title lookups
    permissions: { contents: write, id-token: write, pull-requests: read }
    concurrency: { group: release, cancel-in-progress: false }
    env: { AWS_REGION: "${{ vars.AWS_REGION || 'us-east-1' }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # full history + tags for git describe
      - name: Detect bump, tag, and cut the GitHub release
        id: rel
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            new="v0.1.0" # baseline: first release anchors the series
          else
            # First-parent view of main = one subject per landed PR:
            # "Merge pull request #N ..." for merge commits (resolve N → title),
            # or the PR title itself for squash merges.
            subjects=$(git log --first-parent --format='%s' "$last"..HEAD)
            prs=$(echo "$subjects" | grep -oE '^Merge pull request #[0-9]+' | grep -oE '[0-9]+' || true)
            titles=$(for n in $prs; do gh pr view "$n" --json title -q .title; done)
            drivers=$(printf '%s\n%s' "$titles" "$(echo "$subjects" | grep -vE '^Merge pull request #' || true)")
            echo "Release drivers (PR titles):"; echo "$drivers" | grep -v '^$' || true
            bump="none"
            echo "$drivers" | grep -qE '^[a-z]+(\([^)]*\))?!:' && bump="major"
            [ "$bump" = "none" ] && echo "$drivers" | grep -qE '^feat(\([^)]*\))?:' && bump="minor"
            [ "$bump" = "none" ] && echo "$drivers" | grep -qE '^(fix|perf|infra)(\([^)]*\))?:' && bump="patch"
            if [ "$bump" = "none" ]; then
              echo "No release-worthy PR titles since $last"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            v=${last#v}; IFS=. read -r MA MI PA <<< "$v"
            case $bump in
              major) new="v$((MA + 1)).0.0" ;;
              minor) new="v$MA.$((MI + 1)).0" ;;
              patch) new="v$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          # Tag created SERVER-SIDE by gh release create: GITHUB_TOKEN cannot
          # `git push` a tag whose commit history touches .github/workflows/*
          # (the workflows-permission wall). API-created tags skip that check
          # and still do NOT trigger workflows (same recursion guard) — a
          # future tag-triggered workflow needs an app token here, not a rule
          # change there.
          gh release create "$new" --target "${{ github.sha }}" --generate-notes --title "$new"
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "### Released $new" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.rel.outputs.tag != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with: { role-to-assume: "${{ vars.CI_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION || 'us-east-1' }}" }
      # Every roster service, not just one: a release is a repo-wide claim, so
      # the alias lands on each service's image.
      - name: Alias the release tag onto the deployed images
        if: steps.rel.outputs.tag != ''
        run: |
          # Per-service accounting, no mid-loop abort: the git tag + GH Release
          # are already public by this step, so a transient ECR error must not
          # strand the REMAINING services unaliased — finish the roster, then
          # fail loudly if anything was missed. "No image for this SHA" is a
          # DIFFERENT failure than "tag already present" and says so.
          missed=0
          while IFS=$'\t' read -r svc _f _ns; do
            m=$(aws ecr batch-get-image --repository-name "otel-demo-app/$svc" --image-ids imageTag="${{ github.sha }}" \
                  --query 'images[0].imageManifest' --output text) || m=""
            if [ -z "$m" ] || [ "$m" = "None" ]; then
              echo "::error::otel-demo-app/$svc: no image manifest for ${{ github.sha }} — alias skipped"
              missed=$((missed + 1)); continue
            fi
            aws ecr put-image --repository-name "otel-demo-app/$svc" \
              --image-tag "${{ steps.rel.outputs.tag }}" --image-manifest "$m" >/dev/null \
              || echo "otel-demo-app/$svc: tag already present (immutable repo, re-run) — ok"
            echo "image otel-demo-app/$svc:${{ github.sha }} also tagged ${{ steps.rel.outputs.tag }}"
          done < <(scripts/roster.sh)
          [ "$missed" -eq 0 ] || { echo "::error::$missed roster service(s) not aliased — release ${{ steps.rel.outputs.tag }} is inconsistently tagged in ECR"; exit 1; }
