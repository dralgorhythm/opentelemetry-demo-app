apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # ClusterIP = internal only. Public exposure (Ingress/LB) is a deliberate,
  # billable add-on — see README.
  type: ClusterIP
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
