{{- if .Values.secrets.enabled }}
# What the CSI driver mounts for this service, and how it authenticates.
# usePodIdentity flips ASCP off IRSA onto Pod Identity — the pod's SA (and
# its association, terraform-side) is the identity; no annotations, no OIDC.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.secrets.name | quote }}
        objectType: "secretsmanager"
        objectAlias: {{ .Values.secrets.fileName | quote }}
  {{- if .Values.secrets.sync.enabled }}
  # The env-var delivery path: the driver materializes a native k8s Secret
  # from the mounted object (requires the add-on's syncSecret.enabled).
  # The trade: env is 12-factor-convenient but stale across rotation and
  # leakier than files.
  secretObjects:
    - secretName: {{ .Release.Name }}-secret
      type: Opaque
      data:
        - objectName: {{ .Values.secrets.fileName | quote }} # = the alias above
          key: value
  {{- end }}
{{- end }}
