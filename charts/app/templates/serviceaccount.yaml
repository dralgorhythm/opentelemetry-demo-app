{{- if .Values.serviceAccount.create }}
# The pod's identity anchor. Terraform's aws_eks_pod_identity_association
# binds this exact (namespace, name) to an IAM role — note there are NO
# annotations here: that's IRSA's dialect (role-arn annotation + per-cluster
# OIDC). Pod Identity keeps Kubernetes and IAM configuration cleanly apart.
# The default k8s API token still automounts (nothing here calls the k8s
# API): automountServiceAccountToken=false is a tightening left on the
# table — Pod Identity injects its own separate projected token either way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
{{- end }}
