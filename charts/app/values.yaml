# Generic service chart: defaults are the MINIMAL shape (ClusterIP, one
# replica, no AWS identity, no gates). Each service opts INTO capabilities in
# its deploy/services/<name>.yaml — today's roster is one service (app), but
# the chart stays service-agnostic. CI always sets image.repository and
# image.tag per release.

image:
  repository: "" # <registry>/otel-demo-app/<service> — CI sets
  tag: ""        # git SHA — CI sets

# Container args, appended to the image ENTRYPOINT. The app takes its config
# file path here (e.g. ["-f", "/mnt/secrets-store/config.yml"]) — the path is
# a deploy-side decision, not baked into the image.
args: []

port: 8080          # containerPort; the Service listens on 80 → this
probePath: /healthz # liveness+readiness target

replicaCount: 1 # used ONLY when autoscaling.enabled=false (the HPA owns the count otherwise)

# MEASURED, not guessed (dev, 2026-08-04, ~199k requests over 11 min through
# the ALB; per-pod figures from Container Insights pod_cpu_usage_total and
# pod_memory_working_set):
#
#            idle        peak (~536 rps/pod, 1073 rps total across 2 pods)
#   cpu      0.3m        198m
#   memory   2.0 MiB     6.6 MiB
#
# Zero 5xx across the run and zero restarts, so neither the memory limit nor
# any CPU ceiling was reached. Latency IMPROVED as concurrency rose (p95
# 210ms at c=5 -> 121ms at c=100) while throughput scaled near-linearly to
# 1073 rps: the app never found its knee, so these are floor measurements,
# not saturation ones.
#
# cpu 100m — UNCHANGED, and now for a stated reason: it sits between idle and
# the 198m peak, covering roughly 270 rps/pod. Raising it toward 198m would
# reserve capacity for a synthetic spike this service will never see and
# would make Auto Mode buy bigger nodes; lowering it would make the HPA
# (below) hair-trigger. It also sets a sane scale-out point: 70% of 100m is
# ~190 rps/pod.
#
# memory 32Mi request / 64Mi limit — request trimmed from nothing (it was
# already 32Mi) but the limit is now a DELIBERATE 10x over observed peak
# rather than a guess. Kept generous on purpose: OOMKill is fatal and
# unrecoverable, whereas over-requesting 25 MiB on a 4 GiB node costs
# nothing. The OTel batch exporter is the one component that can spike here.
#
# NO cpu limit — throttling at a limit taxes p99 AND suppresses the HPA's own
# signal (QoS drops Guaranteed→Burstable: a measured trade, not a default).
# Auto Mode sizes nodes off these requests.
resources:
  requests: { cpu: 100m, memory: 32Mi }
  limits: { memory: 64Mi }

# Elastic scaling: CPU % is measured against resources.requests.cpu — the
# same number Karpenter sizes nodes from, so HPA scale-out cascades into node
# provisioning. Needs the metrics-server add-on (terraform/modules/stack/eks.tf — Auto Mode
# does NOT bundle it).
#
# Now unblocked by the measurements above, and left OFF deliberately: at 70%
# of a 100m request, scale-out fires around ~190 rps/pod, and the load run
# showed 2 replicas absorbing 1073 rps without reaching saturation — so this
# service has no demonstrated need to scale. Turning it on is a values
# change; the reason to do it is a real traffic pattern, not the fact that
# the knob exists.
autoscaling:
  enabled: false
  minReplicas: 2 # never below the PDB's assumptions
  maxReplicas: 5
  targetCPUUtilizationPercent: 70

# Placement diversity: node spread is HARD (forces a second instance), zone
# spread is SOFT. Pair with the PDB on anything customer-facing.
topologySpread:
  enabled: false
  # How many hostname domains the HARD spread constraint must see. 2 is the
  # difference between "spread if the cluster happens to have room" and
  # "there must be a second node".
  #
  # Without it the constraint is VACUOUS on a one-node cluster: a single node
  # is a single topology domain, so the skew is 0 and DoNotSchedule is
  # trivially satisfied — every replica lands on that one node, which is the
  # single point of failure the spread exists to prevent. Measured live: 2
  # replicas, 1 node, both co-located.
  #
  # With minDomains: 2 the absent domain counts as 0, so a second replica on
  # the same node computes a skew of 2 (> maxSkew 1) and stays Pending — and
  # THAT is the unschedulable pod that makes Karpenter provision node two.
  #
  # Cost: a second node, permanently. It comes from the spot pool first
  # (deploy/cluster/spot-nodepool.yaml, weight 100), with on-demand
  # general-purpose as the fallback if spot is unavailable for the requested
  # shapes — which is exactly why that built-in pool stays enabled.
  #
  # Set to null to opt out (single-node, cheaper, no HA). Only meaningful
  # with whenUnsatisfiable: DoNotSchedule; k8s 1.30+ (GA).
  minDomains: 2

# Node pinning. Empty = the scheduler's choice (Auto Mode). The concrete use
# here: single-arch images pin their architecture (the Auto Mode
# general-purpose pool is mixed-arch, so an amd64-only image needs
# `kubernetes.io/arch: amd64` or half the fleet ImagePullBackOffs).
nodeSelector: {}
tolerations: []

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# ingress.enabled=true -> an ALB via the chart-declared IngressClass (Auto
# Mode ships no default class). scheme flows into IngressClassParams (Auto
# Mode's config surface), not annotations.
ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  # TLS: list ACM certificate ARN(s) and the ALB grows an HTTPS listener —
  # under Auto Mode certs live in IngressClassParams, NOT the
  # kubernetes.io/tls Secret or annotations a self-managed controller would
  # use. Empty = HTTP only (the named gap: waits on a domain decision).
  certificateARNs: []
  # ALB idle timeout (seconds). The AWS default of 60s silently resets idle
  # WebSocket/long-poll/SSE connections — the classic "worked until someone
  # added streaming" trap. Unset (null) keeps the ALB default.
  idleTimeoutSeconds: null

# The Pod Identity anchor: Terraform associates (namespace, <release name>)
# with an IAM role. Only for services that call AWS APIs.
serviceAccount:
  create: false

# Default-deny ingress to this service's pods, optionally allowing exactly
# one caller (by its app label) on `port`. Requires the network policy
# controller (NOT on by default under Auto Mode) — a deferred hardening
# here; the gate exists so enabling it is a values change, not a chart PR.
networkPolicy:
  enabled: false
  allowFromApp: ""

# Plain name->value container env. The chart is service-agnostic: whatever a
# service needs (OTEL_EXPORTER_OTLP_ENDPOINT, RUST_LOG, ...) lives in its
# deploy/services file, not in chart logic.
env: {}

# One Secrets Manager secret via the Secrets Store CSI driver + ASCP add-on,
# Pod Identity auth (requires serviceAccount.create + a terraform-side
# association and role). Mounts as a FILE at /mnt/secrets-store/<fileName>
# (updates in-place on rotation); sync additionally materializes a k8s
# Secret feeding <sync.envVar> (captured at process start — stale across
# rotation; the env-vs-file trade).
# NOTE: a mount referencing a secret with NO VALUE fails pod start — that's
# fail-fast, not a bug. Set the value before enabling.
secrets:
  enabled: false
  name: ""     # Secrets Manager name (deterministic; ARNs have random suffixes)
  fileName: secret
  sync:
    enabled: false
    envVar: ""
